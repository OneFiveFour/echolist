naming:
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]

style:
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: [ 'DevicePreviews', 'Preview', 'PreviewLightDark', 'PreviewComponentLightDark', 'PreviewPhoneLightDark', 'PreviewDesktopLightDark' ]
  MaxLineLength:
    excludes: [ "**/test/**","**/androidTest/**","**/commonTest/**","**/jvmTest/**" ]
  MagicNumber:
    ignoreAnnotated: [ 'Preview', 'PreviewLightDark', 'PreviewComponentLightDark', 'PreviewPhoneLightDark', 'PreviewDesktopLightDark' ]
    ignoreNumbers: [ '-1', '0', '1', '2', '50' ]
    excludes: [ "**/test/**","**/androidTest/**","**/commonTest/**","**/jvmTest/**" ]
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    active: false
  ForbiddenComment:
    active: false
  NewLineAtEndOfFile:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

complexity:
  LongParameterList:
    ignoreAnnotated: [ 'Composable' ]
  LongMethod:
    ignoreAnnotated: [ 'Composable' ]
  CyclomaticComplexMethod:
    ignoreAnnotated: [ 'Composable' ]
  TooManyFunctions:
    thresholdInClasses: 15

compose:
  ReusedModifierInstance:
    active: true
  UnnecessaryEventHandlerParameter:
    active: true
  # AGENTS.md prescribes `navTo...` for navigation callbacks, which this rule would reject.
  ComposableEventParameterNaming:
    active: false
  ComposableParametersOrdering:
    active: true
  ModifierHeightWithText:
    active: true
  MissingModifierDefaultValue:
    active: true
  PublicComposablePreview:
    active: true
  TopLevelComposableFunctions:
    active: true
    allowInObjects: false
  ComposableFunctionName:
    active: true
  ConditionCouldBeLifted:
    active: true
    ignoreCallsWithArgumentNames: [ 'modifier', 'contentAlignment' ]